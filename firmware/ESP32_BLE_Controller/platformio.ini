; ESP32 #1 — handheld BLE joystick transmitter
; Board and Arduino 2.x core match the original BaseCam_ESP32_Control build

[env:esp32-s3-devkitc-1]
platform = espressif32@6.7.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
lib_ldf_mode = chain
